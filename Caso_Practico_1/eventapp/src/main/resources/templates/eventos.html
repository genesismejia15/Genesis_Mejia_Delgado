<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | EventApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Catalogo de eventos</h1>
            <p class="text-muted mb-0">
                Total: <span class="badge bg-primary" th:text="${eventos.size()}">0</span>
            </p>
        </div>

        <a th:href="@{/eventos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Nuevo evento
        </a>
    </div>

    <form th:action="@{/eventos/buscar}" method="get" class="row g-2 mb-4">
        <div class="col-md-10">
            <input type="text" name="nombre" class="form-control" placeholder="Buscar evento por nombre">
        </div>
        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-outline-primary">Buscar</button>
        </div>
    </form>

    <div class="alert alert-success alert-dismissible fade show" th:if="${ok}" role="alert">
        <span th:text="${ok}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="e : ${eventos}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">

                    <div class="mb-2">
                        <span class="badge bg-secondary" th:text="${e.categoria}">categoria</span>
                        <span class="badge bg-danger ms-1" th:if="${e.lleno}">Lleno</span>
                        <span class="badge bg-success ms-1" th:unless="${e.lleno}">Disponible</span>
                    </div>

                    <h5 class="card-title" th:text="${e.nombre}">Nombre del evento</h5>

                    <p class="text-muted small flex-grow-1" th:text="${e.descripcion}">
                        Descripcion breve del evento.
                    </p>

                    <div class="small text-muted mb-2">
                        <i class="bi bi-calendar-event me-1"></i>
                        <span th:text="${e.fechaFormateada}">15 de agosto de 2026</span>
                    </div>

                    <div class="small text-muted mb-2">
                        <i class="bi bi-geo-alt me-1"></i>
                        <span th:text="${e.lugar}">Lugar</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <small>
                            <span class="fw-bold" th:text="${e.cuposVendidos} + ' / ' + ${e.cupoMaximo}">0/0</span>
                            cupos
                        </small>

                        <div class="btn-group">
                            <a class="btn btn-outline-primary btn-sm"
                               th:href="@{/eventos/{id}(id=${e.id})}">
                                Ver
                            </a>

                            <a class="btn btn-outline-warning btn-sm"
                               th:href="@{/eventos/{id}/editar(id=${e.id})}">
                                Editar
                            </a>

                            <button type="button"
                                    class="btn btn-outline-danger btn-sm"
                                    data-bs-toggle="modal"
                                    data-bs-target="#modalEliminar"
                                    th:attr="data-id=${e.id},data-nombre=${e.nombre}">
                                Eliminar
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-warning mt-4" th:if="${eventos.isEmpty()}">
        <i class="bi bi-exclamation-triangle me-2"></i>
        No hay eventos para mostrar.
    </div>

</main>

<footer th:replace="~{fragments/header :: footer}"></footer>

<div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formEliminar" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEliminarLabel">Confirmar eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    ¿Seguro que querés eliminar el evento
                    <strong id="nombreEventoEliminar">este evento</strong>?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const modalEliminar = document.getElementById('modalEliminar');

    modalEliminar.addEventListener('show.bs.modal', function (event) {
        const boton = event.relatedTarget;
        const id = boton.getAttribute('data-id');
        const nombre = boton.getAttribute('data-nombre');

        document.getElementById('formEliminar').action = '/eventos/' + id + '/eliminar';
        document.getElementById('nombreEventoEliminar').textContent = nombre;
    });
</script>

</body>
</html>
