<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Nuevo prestamo')}"></head>
<body>

<div th:replace="~{fragments/header :: nav}"></div>

<div class="container">

    <h2 class="mb-4">Registrar prestamo</h2>

    <div th:if="${libro != null}">
        <p>
            <strong>Libro:</strong>
            <span th:text="${libro.titulo}"></span>
        </p>

        <p>
            <strong>Autor:</strong>
            <span th:text="${libro.autor}"></span>
        </p>

        <p>
            <strong>Copias disponibles:</strong>
            <span th:text="${libro.copiasDisponibles}"></span>
        </p>

        <form th:action="@{/prestamos/guardar}" method="post">

            <input type="hidden"
                   name="libroId"
                   th:value="${libro.id}">

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       required>
            </div>

            <button type="submit" class="btn btn-primary">
                Registrar prestamo
            </button>

            <a href="/libros" class="btn btn-secondary">
                Cancelar
            </a>

        </form>
    </div>

    <div th:if="${libro == null}" class="alert alert-danger">
        Libro no encontrado.
    </div>

</div>

</body>
</html>
